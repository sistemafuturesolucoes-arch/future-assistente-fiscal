name: Validar extensão

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validar Manifest e JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar e compilar Driver.js headless
        run: |
          npm install --no-audit --no-fund
          npm run build:driver

      - name: Validar JSON do Manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest.json válido')"

      - name: Verificar sintaxe do content script
        run: node --check src/content.js

      - name: Verificar sintaxe do carregador do Manual
        run: node --check src/knowledge.js

      - name: Preparar Deno para validar as funções Supabase
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar funções Supabase
        run: |
          deno check supabase/functions/ai-assistant/index.ts
          deno --node-modules-dir=auto check supabase/functions/assistant-voice/index.ts

      - name: Preparar navegador para testes reais da extensão
        run: |
          npm install --no-save playwright@1.65.0
          npx playwright install --with-deps chromium

      - name: Executar testes automatizados
        run: node --test tests/*.test.cjs

      - name: Montar pacote instalável da extensão
        run: |
          mkdir -p dist
          zip -r dist/Future-Assistente-Fiscal-Chrome.zip manifest.json src README.md docs

      - name: Publicar pacote para teste
        uses: actions/upload-artifact@v4
        with:
          name: Future-Assistente-Fiscal-Chrome
          path: dist/Future-Assistente-Fiscal-Chrome.zip
          if-no-files-found: error
          retention-days: 14
